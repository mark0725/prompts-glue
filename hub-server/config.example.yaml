# hub-server 配置示例。文件格式按扩展名识别：.yaml/.yml、.json、.toml 均可
# （TOML 用 [section] 表，JSON 用根对象；字段名与本文件一致）。
# 所有字段均可通过环境变量（HUB_ 前缀，__ 表示层级，如 HUB_LLM__MODEL）
# 或命令行参数（横杠表示层级，如 --llm-model）覆盖。
# 优先级：命令行参数 > 环境变量 > 配置文件 > 代码默认值。
server:
  address: ":8080"
  public_base_url: "http://localhost:8080"
database:
  driver: "sqlite"
  dsn: "hub-server.db"
auth:
  token_ttl: 24h
  admin_username: "admin"
  admin_password: "change-me"
llm:
  model: ""
  api_base: ""
  api_key: ""
  proxy: ""
cache:
  default_strategy: "VERSIONED"
  ttl: 1h
limits:
  request_body_bytes: 1048576
  page_size_max: 100
  expression_length: 20000
  dependency_depth: 16
logging:
  level: "debug"
