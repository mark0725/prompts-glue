# hub-server 配置示例。文件格式按扩展名识别：.yaml/.yml、.json、.toml 均可
# （TOML 用 [section] 表，JSON 用根对象；字段名与本文件一致）。
# 所有字段均可通过环境变量（HUB_ 前缀，__ 表示层级，如 HUB_LLM__MODEL）
# 或命令行参数（横杠表示层级，如 --llm-model）覆盖。
# 优先级：命令行参数 > 环境变量 > 配置文件 > 代码默认值。
server:
  address: ":8080"
  public_base_url: "http://localhost:8080"
database:
  driver: "sqlite"
  dsn: "hub-server.db"
auth:
  token_ttl: 24h
  admin_username: "admin"
  admin_password: "change-me"
llm:
  model: ""
  api_base: ""
  api_key: ""
  proxy: ""
cache:
  default_strategy: "VERSIONED"
  ttl: 1h
limits:
  request_body_bytes: 1048576
  page_size_max: 100
  expression_length: 20000
  dependency_depth: 16
logging:
  level: "debug"

# LDAP 用户同步与登录验证。enable=false 时不同步，且 LDAP 来源用户无法登录。
# 同步默认写入 manager_users 表；在 sync_targets 中加入 "web" 时，也同步到 users（web 用户表）。
# 用户显示名取 display_name_attribute（默认 givenName），缺失时回退到 attribute（默认 uid）。
ldap:
  enable: false
  host: "10.1.1.202"
  port: 389
  bind_dn: "cn=root,dc=test,dc=com"
  bind_password: "pass1234"
  search_dn: "ou=People,dc=test,dc=com"
  user_filter: "(objectClass=person)"
  attribute: "uid"
  display_name_attribute: "givenName"
  filter: ""                # 账号名(uid)正则，匹配的才同步；为空则不过滤(全部同步)
  start_tls: false
  ldaps: false
  verify_host: true
  timeout: 10s
  sync_targets: ["manager"]   # 可选值：manager、web；含 web 时同时同步到 web 用户表
  sync_interval: 30m

# SMTP 邮件发送（预留，当前未启用）。
smtp:
  host: "smtp.exmail.qq.com"
  port: 465
  sender: "service@gingkoo.com"
  password: "1234"
  smtps: true