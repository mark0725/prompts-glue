# prompts-glue 容器编排
#
# MySQL 独立部署在外部实例 10.2.20.161:3306，库名 glue_db，不纳入本编排。
# 启动前必须设置数据库账号:
#   export GLUE_DB_USER=<账号>
#   export GLUE_DB_PASSWORD=<密码>
#   # 密码含特殊字符时需按 net/url 规则转义后再写入环境变量
#
# hub-server 单容器同时提供 API、Web 和 Manager 三个端口，无需 nginx。
# 如需拆分部署，可用同一镜像启动多个容器，并通过 HUB_WEB__ENABLE /
# HUB_MANAGER__ENABLE 控制各容器启用的前端端口。
#
# 启动:
#   docker compose up -d --build
#
# 访问:
#   API:      http://localhost:10800
#   Web:      http://localhost:10801
#   Manager:  http://localhost:10802
#
# 修改管理员密码请调整 HUB_AUTH__ADMIN_PASSWORD，勿使用示例默认值。

services:
  glue-hub-server:
    build:
      context: .
      dockerfile: hub-server/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      HUB_DATABASE__DRIVER: mysql
      HUB_DATABASE__DSN: "${GLUE_DB_USER:?请设置 GLUE_DB_USER}:${GLUE_DB_PASSWORD:?请设置 GLUE_DB_PASSWORD}@tcp(10.2.20.161:3306)/glue_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=10s&readTimeout=30s&writeTimeout=30s"
      HUB_AUTH__ADMIN_USERNAME: ${HUB_AUTH__ADMIN_USERNAME:-admin}
      HUB_AUTH__ADMIN_PASSWORD: ${HUB_AUTH__ADMIN_PASSWORD:-change-me}
      HUB_LOGGING__LEVEL: ${HUB_LOGGING__LEVEL:-info}
      HUB_LLM__MODEL: ${HUB_LLM__MODEL:-}
      HUB_LLM__API_BASE: ${HUB_LLM__API_BASE:-}
      HUB_LLM__API_KEY: ${HUB_LLM__API_KEY:-}
      HUB_LDAP__ENABLE: ${HUB_LDAP__ENABLE:-true}
      HUB_LDAP__HOST: ${HUB_LDAP__HOST:-}
      HUB_LDAP__PORT: ${HUB_LDAP__PORT:-389}
      HUB_LDAP__BIND_DN: ${HUB_LDAP__BIND_DN:-}
      HUB_LDAP__BIND_PASSWORD: ${HUB_LDAP__BIND_PASSWORD:-}
      HUB_LDAP__SEARCH_DN: ${HUB_LDAP__SEARCH_DN:-}
      HUB_LDAP__FILTER: ${HUB_LDAP__FILTER:-}
      HUB_LDAP__START_TLS: ${HUB_LDAP__START_TLS:-false}
      HUB_LDAP__LDAPS: ${HUB_LDAP__LDAPS:-false}
      HUB_LDAP__VERIFY_HOST: ${HUB_LDAP__VERIFY_HOST:-true}
      HUB_LDAP__TIMEOUT: ${HUB_LDAP__TIMEOUT:-10s}
      HUB_LDAP__SYNC_TARGETS__0: manager
      HUB_LDAP__SYNC_TARGETS__1: web
      HUB_LDAP__SYNC_INTERVAL: ${HUB_LDAP__SYNC_INTERVAL:-30m}
      HUB_SMTP__PASSWORD: ${SMTP__PASSWORD:-}
      HUB_WEB__ENABLE: ${HUB_WEB__ENABLE:-true}
      HUB_MANAGER__ENABLE: ${HUB_MANAGER__ENABLE:-true}
    ports:
      - "10800:8080"
      - "10801:8081"
      - "10802:8082"
